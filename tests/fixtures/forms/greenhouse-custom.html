<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply — Acme (Greenhouse, custom questions)</title>
  </head>
  <body>
    <!--
      Representative Greenhouse form with custom screening questions that match
      prepared answers (work authorization, sponsorship, "how did you hear"),
      one required unmatched question, plus the untouched EEO section.
    -->
    <main>
      <h1>Apply to Acme — Staff Engineer</h1>
      <form id="application_form" action="/do-not-submit" method="post">
        <div class="field">
          <label for="first_name">First Name *</label>
          <input type="text" id="first_name" name="job_application[first_name]" required />
        </div>
        <div class="field">
          <label for="last_name">Last Name *</label>
          <input type="text" id="last_name" name="job_application[last_name]" required />
        </div>
        <div class="field">
          <label for="email">Email *</label>
          <input type="email" id="email" name="job_application[email]" required />
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="job_application[phone]" />
        </div>
        <div class="field">
          <label for="linkedin">LinkedIn Profile</label>
          <input type="url" id="linkedin" name="job_application[answers_attributes][0][text_value]" />
        </div>
        <div class="field">
          <label for="resume">Resume/CV *</label>
          <input type="file" id="resume" name="job_application[resume]" required />
        </div>

        <div class="field">
          <label for="work_auth">Are you authorized to work in the United States? *</label>
          <select id="work_auth" name="job_application[answers_attributes][1][value]" required>
            <option value="">Please select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
        <div class="field">
          <label for="sponsorship">Will you now or in the future require sponsorship? *</label>
          <select id="sponsorship" name="job_application[answers_attributes][2][value]" required>
            <option value="">Please select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
        <div class="field">
          <label for="hear">How did you hear about us?</label>
          <input type="text" id="hear" name="job_application[answers_attributes][3][text_value]" />
        </div>
        <div class="field">
          <label for="project">Describe a project you are proud of *</label>
          <textarea id="project" name="job_application[answers_attributes][4][text_value]" required></textarea>
        </div>

        <fieldset class="eeo-section">
          <legend>U.S. Equal Opportunity Employment Information</legend>
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="job_application[gender]">
              <option value="">Please select</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>
          <div class="field">
            <label for="hispanic">Are you Hispanic or Latino?</label>
            <select id="hispanic" name="job_application[hispanic_latino]">
              <option value="">Please select</option>
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>
          <div class="field">
            <label for="disability">Disability Status</label>
            <select id="disability" name="job_application[disability_status]">
              <option value="">Please select</option>
              <option value="yes">Yes, I have a disability</option>
              <option value="no">No, I do not have a disability</option>
            </select>
          </div>
        </fieldset>

        <div class="actions">
          <button type="submit" id="submit_app">Submit Application</button>
        </div>
      </form>
    </main>
  </body>
</html>
