<!doctype html>
<!-- Hand-made for J29: a job board's sign-up box, one email field. Fictional; not copied from any site. -->
<html lang="en">
  <head><meta charset="utf-8"><title>Staff Engineer · Northwind Jobs</title></head>
  <body>
    <main>
      <h1>Staff Engineer</h1>
      <p>Fourth Coffee · Remote</p>
      <form action="/signup" method="post">
        <h2>Create a free account to apply</h2>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required>
        <button type="submit">Continue</button>
      </form>
    </main>
  </body>
</html>
