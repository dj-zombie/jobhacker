<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply — Globex (Lever)</title>
  </head>
  <body>
    <!--
      Representative Lever application form (hand-written fixture; see STATUS).
      Lever uses a single "Full name" field. Includes resume upload and an
      untouched EEO / self-identification section (invariant 7).
    -->
    <main>
      <h2>Globex — Frontend Engineer</h2>
      <form id="application-form" action="/do-not-submit" method="post">
        <div class="application-field">
          <label for="name">Full name✱</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="application-field">
          <label for="email">Email✱</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="application-field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" />
        </div>
        <div class="application-field">
          <label for="org">Current company</label>
          <input type="text" id="org" name="org" />
        </div>
        <div class="application-field">
          <label for="linkedin">LinkedIn URL</label>
          <input type="url" id="linkedin" name="urls[LinkedIn]" />
        </div>
        <div class="application-field">
          <label for="resume">Resume/CV✱</label>
          <input type="file" id="resume" name="resume" required />
        </div>

        <section class="eeoDisclosure">
          <h4>Voluntary Self-Identification</h4>
          <div class="application-field">
            <label for="gender">Gender</label>
            <select id="gender" name="eeo[gender]">
              <option value="">Select...</option>
              <option value="man">Man</option>
              <option value="woman">Woman</option>
            </select>
          </div>
          <div class="application-field">
            <label for="race">Race</label>
            <select id="race" name="eeo[race]">
              <option value="">Select...</option>
              <option value="asian">Asian</option>
              <option value="white">White</option>
            </select>
          </div>
        </section>

        <div class="section-submit">
          <button type="submit" id="btn-submit">Submit application</button>
        </div>
      </form>
    </main>
  </body>
</html>
