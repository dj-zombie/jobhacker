<!doctype html>
<!-- Hand-made for J29: a job board's keyword and location search boxes. Fictional; not copied from any site. -->
<html lang="en">
  <head><meta charset="utf-8"><title>Search jobs · Northwind Jobs</title></head>
  <body>
    <header>
      <form role="search" action="/search">
        <label for="keywords">Job title or keyword</label>
        <input id="keywords" name="q" type="search">
        <label for="where">Location</label>
        <input id="where" name="l" type="text" placeholder="City, state or Remote">
        <button type="submit">Search jobs</button>
      </form>
    </header>
    <main>
      <h1>Senior Frontend Engineer</h1>
      <p>Contoso · Phoenix, AZ</p>
    </main>
  </body>
</html>
